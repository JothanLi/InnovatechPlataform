spring.application.name=bff-service
server.port=8085

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

innovatech.services.proyectos=${PROYECTOS_SERVICE_URL:http://localhost:8081}
innovatech.services.tareas=${TAREAS_SERVICE_URL:http://localhost:8084}
innovatech.services.equipos=${EQUIPOS_SERVICE_URL:http://localhost:8083}

resilience4j.circuitbreaker.instances.bffService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bffService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.bffService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bffService.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httpexchanges
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microservicio de la plataforma Innovatech
info.app.version=1.0.0

spring.application.name=api-gateway

server.port=8090

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httpexchanges
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microservicio de la plataforma Innovatech
info.app.version=1.0.0

spring.cloud.gateway.server.webmvc.routes[0].id=proyectos-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${PROYECTOS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/proyectos/**

spring.cloud.gateway.server.webmvc.routes[1].id=equipos-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${EQUIPOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/equipos/**

spring.cloud.gateway.server.webmvc.routes[2].id=tareas-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TAREAS_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/tareas/**

spring.cloud.gateway.server.webmvc.routes[3].id=bff-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${BFF_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/bff/**

jwt.secret=${JWT_SECRET:innovatech_super_secret_key_2026_para_jwt_seguro_123456789}
jwt.expiration-ms=86400000

# SERVICIOS INTERNOS - API GATEWAY
innovatech.services.proyectos.url=${PROYECTOS_SERVICE_URL:http://localhost:8081}
innovatech.services.tareas.url=${TAREAS_SERVICE_URL:http://localhost:8084}
innovatech.services.equipos.url=${EQUIPOS_SERVICE_URL:http://localhost:8083}
innovatech.services.bff.url=${BFF_SERVICE_URL:http://localhost:8085}

# JWT
innovatech.security.jwt.secret=${INNOVATECH_SECURITY_JWT_SECRET:innovatech_super_secret_key_2026_para_jwt_seguro_123456789}
innovatech.security.jwt.expiration-ms=${INNOVATECH_SECURITY_JWT_EXPIRATION_MS:86400000}
innovatech.security.jwt.expiration-minutes=${INNOVATECH_SECURITY_JWT_EXPIRATION_MINUTES:1440}

# CORS
innovatech.security.cors.allowed-origins=${INNOVATECH_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
innovatech.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
innovatech.security.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
innovatech.security.cors.exposed-headers=Authorization
innovatech.security.cors.allow-credentials=true
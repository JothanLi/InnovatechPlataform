spring.application.name=api-gateway

server.port=8090

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httpexchanges
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microservicio de la plataforma Innovatech
info.app.version=1.0.0

spring.cloud.gateway.server.webmvc.routes[0].id=proyectos-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${PROYECTOS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/proyectos/**

spring.cloud.gateway.server.webmvc.routes[1].id=equipos-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${EQUIPOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/equipos/**

spring.cloud.gateway.server.webmvc.routes[2].id=tareas-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TAREAS_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/tareas/**

spring.cloud.gateway.server.webmvc.routes[3].id=bff-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${BFF_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/bff/**
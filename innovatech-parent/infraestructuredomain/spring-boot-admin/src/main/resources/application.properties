spring.application.name=spring-boot-admin

server.port=9090

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,httpexchanges
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Spring Boot Admin
info.app.description=Servidor de monitoreo de microservicios Innovatech
info.app.version=1.0.0
spring.application.name=equipos-service
server.port=8083

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/innovatech_equipos
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Circuit Breaker
resilience4j.circuitbreaker.instances.proyectosService.sliding-window-size=5
resilience4j.circuitbreaker.instances.proyectosService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.proyectosService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.proyectosService.wait-duration-in-open-state=10s
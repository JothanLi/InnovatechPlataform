spring.application.name=tareas-service
server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/innovatech_tareas
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

resilience4j.circuitbreaker.instances.proyectosService.sliding-window-size=5
resilience4j.circuitbreaker.instances.proyectosService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.proyectosService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.proyectosService.wait-duration-in-open-state=10s